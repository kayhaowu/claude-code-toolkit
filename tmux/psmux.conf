# psmux (native Windows tmux) port of tmux/tmux.conf in claude-code-toolkit.
# Install with: powershell -ExecutionPolicy Bypass -File tmux\install.ps1
# (copies this file to ~/.psmux.conf and tmux/scripts/* to ~/.config/psmux/scripts/).
#
# Differences from the Linux original:
#   - No TPM/plugins. Catppuccin Mocha, tmux-sensible, vim-tmux-navigator, tmux-cpu,
#     tmux-battery and tmux-open are reimplemented inline / with PowerShell helpers
#     in ~/.config/psmux/scripts/ (tmux/scripts/ in the repo).
#   - if-shell conditions run in PowerShell (psmux's if-shell shell); #(...) runs in cmd.exe.
#   - Config path is ~/.psmux.conf (psmux does not read ~/.config/tmux/tmux.conf).
#
# Catppuccin Mocha palette (literal hex below):
#   crust #11111b  mantle #181825  base #1e1e2e  surface0 #313244  surface1 #45475a
#   overlay0 #6c7086  overlay2 #9399b2  text #cdd6f4  red #f38ba8  peach #fab387
#   yellow #f9e2af  green #a6e3a1  teal #94e2d5  sapphire #74c7ec  blue #89b4fa
#   lavender #b4befe  mauve #cba6f7

# ── Shell (must come before the first command so the first pane gets it) ─────
set -g default-shell pwsh
# psmux forces PSReadLine PredictionSource None (no autosuggestions) unless this is on.
set -g allow-predictions on

set -g history-limit 102400

# ── tmux-sensible equivalents ────────────────────────────────────────────────
# escape-time 50 instead of sensible's 0: psmux recommends 50 ms on Windows so
# escape sequences are not split.
set -g escape-time 50
set -g display-time 4000
set -g focus-events on
set -g aggressive-resize on
set -g status-keys emacs

# True color / terminal. Git for Windows' ncurses has no tmux-256color entry,
# so xterm-256color keeps vim/less from Git Bash working inside panes.
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -gs set-clipboard on

# ── Prefix ───────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix
bind-key a send-prefix

# ── Key bindings (same as the original) ──────────────────────────────────────
bind-key s setw synchronize-panes
bind-key C-l send-keys C-l \; clear-history

bind c new-window -c "#{pane_current_path}"

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.psmux.conf \; display-message "Config reloaded"
bind R source-file ~/.psmux.conf \; display-message "Config reloaded"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# tmux-sensible window switching
bind C-p previous-window
bind C-n next-window

# ── vim-tmux-navigator (tmux side), no ps/grep: psmux reports the foreground
#    program in #{pane_current_command} ─────────────────────────────────────────
bind-key -n C-h if-shell -F '#{m/ri:^g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$,#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'
# kiro-cli uses C-j as newline (Shift+Enter submits on Windows). psmux reports the
# deepest child, so a kiro-cli pane shows up as node; C-j only, C-a Down still moves.
bind-key -n C-j if-shell -F '#{m/ri:^(g?(view|l?n?vim?x?|fzf)(diff)?|kiro-cli|node|bun)(\.exe)?$,#{pane_current_command}}' 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell -F '#{m/ri:^g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$,#{pane_current_command}}' 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell -F '#{m/ri:^g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$,#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell -F '#{m/ri:^g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$,#{pane_current_command}}' 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
# Fallback if the conditional keys ever stop dispatching: replace the five -n
# lines above with plain `bind-key -n C-h select-pane -L` (etc.).

# ── tmux-open equivalent: o = open selection, S = search it on Google ─────────
bind-key -T copy-mode    o send -X copy-pipe-and-cancel 'pwsh -NoProfile -File ~/.config/psmux/scripts/open.ps1'
bind-key -T copy-mode-vi o send -X copy-pipe-and-cancel 'pwsh -NoProfile -File ~/.config/psmux/scripts/open.ps1'
bind-key -T copy-mode    S send -X copy-pipe-and-cancel 'pwsh -NoProfile -File ~/.config/psmux/scripts/open.ps1 -Search'
bind-key -T copy-mode-vi S send -X copy-pipe-and-cancel 'pwsh -NoProfile -File ~/.config/psmux/scripts/open.ps1 -Search'

# ── Mouse: on unless inside the VS Code terminal ─────────────────────────────
# psmux copies a mouse drag to the Windows clipboard on release by itself, so
# the original MouseDragEnd1Pane binding is not needed. psmux defaults mouse to
# on. Mouse is set on first and only switched off by a true condition: on a
# reload (C-a r) psmux 3.4.0 can evaluate every config if-shell as false, which
# with an on/off pair turned the mouse off outside VS Code.
set -g mouse on
if-shell 'switch ($env:TERM_PROGRAM) { vscode { exit 0 } default { exit 1 } }' 'set -g mouse off'

# ── Catppuccin Mocha theme (inline, no plugin) ───────────────────────────────
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-justify left
set -g message-style "fg=#94e2d5,bg=#313244"
set -g message-command-style "fg=#94e2d5,bg=#313244"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "#{?pane_in_mode,fg=#fab387,#{?pane_synchronized,fg=#cba6f7,fg=#b4befe}}"
set -g clock-mode-colour "#89b4fa"

# Rounded window pills, flags shown as icons
set -g window-status-separator " "
set -g window-status-format "#[fg=#9399b2,bg=#181825]#[fg=#11111b,bg=#9399b2]#I #[fg=#cdd6f4,bg=#313244] #W#{?window_activity_flag, 󱅫,}#{?window_bell_flag, 󰂞,}#{?window_silence_flag, 󰂛,}#{?window_last_flag, 󰖰,}#{?window_zoomed_flag, 󰁌,}#[fg=#313244,bg=#181825]"
set -g window-status-current-format "#[fg=#cba6f7,bg=#181825]#[fg=#11111b,bg=#cba6f7]#I #[fg=#cdd6f4,bg=#45475a] #W 󰖯#{?window_zoomed_flag, 󰁌,}#[fg=#45475a,bg=#181825]"

# ── Status line ──────────────────────────────────────────────────────────────
set -g status-interval 2
set -g status-right-length 200
set -g status-left-length 100

# session module: green, red while the prefix is active
set -g status-left "#{?client_prefix,#[fg=#f38ba8],#[fg=#a6e3a1]}#[bg=#181825]#[fg=#11111b]#{?client_prefix,#[bg=#f38ba8],#[bg=#a6e3a1]} #[fg=#cdd6f4,bg=#313244] #S#[fg=#313244,bg=#181825]█ "

# CPU / RAM / battery come pre-formatted from the collector's cache file
# (sysinfo.ps1, started below); then date/time and the current pane's git branch.
# No double quotes inside #(...): psmux 3.4.0 stores a " in a config string as \",
# which breaks the cmd.exe command (show-options still displays it correctly).
# It also leaves #{...} unexpanded inside #(), so git-branch.cmd asks the server
# for the active pane's path itself.
set -g status-right '#(type %USERPROFILE%\.config\psmux\cache\sysinfo.txt 2>nul)#[fg=#74c7ec,bg=#181825]#[fg=#11111b,bg=#74c7ec]󰃰 #[fg=#cdd6f4,bg=#313244] %Y/%m/%d %H:%M#[fg=#313244,bg=#181825]█#[fg=#cba6f7,bg=#181825]  #(%USERPROFILE%\.config\psmux\scripts\git-branch.cmd) '

# copy mode selection highlight color
set -g mode-style "fg=#11111b,bg=#fab387"

# One collector per user (named mutex); it exits when no psmux session is left.
run-shell -b '~/.config/psmux/scripts/sysinfo.ps1'

# ── Claude Code session monitor (conditional) ────────────────────────────────
# Only when the Claude Code statusline is installed (~/.claude/tmux-sessions.sh).
# The original sh script (needs jq, present via winget) runs under Git Bash so its
# kill -0 PID checks match the PIDs the bash statusline hooks write.
if-shell 'if (!(Test-Path ~/.claude/tmux-sessions.sh)) { exit 1 }' {
    set -g status 2
    set -g status-format[1] '#[align=left,fg=#cba6f7,bg=#11111b] Claude: #(%LOCALAPPDATA%\Programs\Git\bin\bash.exe %USERPROFILE%\.claude\tmux-sessions.sh)'
}
